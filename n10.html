<CENTER><FONT SIZE=+3>SHADOWS</FONT><FONT SIZE=+3></FONT>
<P><FONT SIZE=+3>Down at the hadji-</FONT>
<BR><FONT SIZE=+3>a shattered owl adorns the Shah's adobe dowel.</FONT>
<BR><FONT SIZE=+3>A sham Hades?</FONT>
<BR><FONT SIZE=+3>Adonis owes dowdy shamans adoration.</FONT>
<BR><FONT SIZE=+3>Sharp dowries had shameful adolescents shaking</FONT>
<BR><FONT SIZE=+3>lest shawm-shards in shark-shapes</FONT>
<BR><FONT SIZE=+3>cast shadows in Shanghai.</FONT><FONT SIZE=+3></FONT>
