<CENTER><FONT SIZE=+3>BLOT</FONT><FONT SIZE=+3></FONT>
<P><FONT SIZE=+3>Otology, or other otiose logic,</FONT>
<BR><FONT SIZE=+3>is loath to bleed otters black an blue.</FONT>
<BR><FONT SIZE=+3>Low longitudes, Lord,</FONT>
<BR><FONT SIZE=+3>otherwise the locksmith blots my ottoman.</FONT>
<BR><FONT SIZE=+3>Lob a bleak loincloth, blabbing.</FONT><FONT SIZE=+3></FONT>
